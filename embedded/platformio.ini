; PlatformIO Project Configuration File
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Envs:
;   sim            servos driven by fake MQTT offsets, no IMU (default)
;   sim_imu        same as sim, plus IMU readout (observe only)
;   calibrate_imu  accel calibration firmware, run once per board

[platformio]
default_envs = sim

; Shared by every env below.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
