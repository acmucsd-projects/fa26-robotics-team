; Vec3 uses C++17 (is_arithmetic_v). The old default is gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:extra_script.py

[env:sim]
; Every .cpp in src/ is compiled, so keep the other firmware and the IMU
; out of this build. Remove -<IMU.cpp> when the closed loop is enabled.
build_src_filter = +<*> -<CalibrateIMU.cpp> -<IMU.cpp>
lib_deps =
    workloads/SCServo

[env:calibrate_imu]
build_src_filter = -<*> +<CalibrateIMU.cpp> +<IMU.cpp>
lib_deps =
    dfrobot/DFRobot_BMI160

; Same as sim, plus the IMU read and print (observe only).
[env:sim_imu]
build_src_filter = +<*> -<CalibrateIMU.cpp>
build_flags =
    ${env.build_flags}
    -DUSE_IMU
lib_deps =
    workloads/SCServo
    dfrobot/DFRobot_BMI160
extra_scripts = pre:extra_script.py
build_src_filter = +<main.cpp> +<IMU.cpp>