; PlatformIO Project Configuration File
; Docs: https://docs.platformio.org/page/projectconf.html
;
; One env. To run the accel calibration firmware instead, swap the
; build_src_filter line for the commented one below, upload, then swap back.

[platformio]
default_envs = gimbal

[env:gimbal]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_IMU
    -DUsername=\"yournetwork\"
    -DPassword=\"yourpass\"
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:extra_script.py
; CalibrateIMU.cpp has its own setup()/loop(), so it stays out of this build.
build_src_filter = +<*> -<CalibrateIMU.cpp>
; For calibration, use this instead:
; build_src_filter = -<*> +<CalibrateIMU.cpp> +<IMU.cpp>
lib_deps =
    workloads/SCServo
    dfrobot/DFRobot_BMI160
    knolleary/PubSubClient